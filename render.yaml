# Render Blueprint — deploys the FastAPI app (static frontend + /api/* routes).
# In the Render dashboard: New + -> Blueprint -> connect this repo -> Apply.
services:
  - type: web
    name: report-translator
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # Render injects $PORT; uvicorn must bind 0.0.0.0 on it.
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
